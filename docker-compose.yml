services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_URL=sqlite:///./1hub.db
      - CORS_ORIGINS=http://localhost:5173
      - ENV=dev
      - NAPAS_CLIENT_TYPE=mock
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
